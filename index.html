<!doctype html>
<html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="robots" content="noindex, nofollow">
<title>شجرة العائلة</title>
<style>
  :root{
    --paper:#efe4c6; --paper2:#e6d8b2; --ink:#2b2417; --muted:#6b5d3f;
    --gold:#c8a24a; --gold-d:#a5822f; --tile:#d9c79a; --tile-b:#b89a52;
    --card:#fffdf7; --line:#b9a578; --accent:#7c5c1e; --danger:#b23b2e;
    --shadow:0 2px 6px rgba(60,45,15,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic",Tahoma,"Segoe UI",sans-serif;
    color:var(--ink); direction:rtl;
    background:
      radial-gradient(120% 120% at 20% 0%, #f5ecd2 0%, rgba(245,236,210,0) 55%),
      radial-gradient(120% 120% at 90% 100%, #e2d2a6 0%, rgba(226,210,166,0) 60%),
      linear-gradient(160deg,var(--paper),var(--paper2));
    background-attachment:fixed;
  }
  body::before{ /* subtle paper grain */
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.06; z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  /* ---------- toolbar ---------- */
  header{
    position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:10px 14px; background:rgba(60,45,15,.92); color:#f6edd2; box-shadow:var(--shadow);
  }
  header h1{font-size:17px; margin:0 4px 0 10px; font-weight:700; letter-spacing:.3px; white-space:nowrap}
  header .sp{flex:1}
  .btn{
    border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#f6edd2;
    padding:7px 11px; border-radius:9px; font:inherit; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{background:rgba(255,255,255,.18)}
  .btn.on{background:var(--gold); color:#3a2c08; border-color:var(--gold-d); font-weight:700}
  .btn.primary{background:var(--gold); color:#3a2c08; border-color:var(--gold-d); font-weight:700}
  .menu{position:relative}
  .menu .list{position:absolute; top:110%; inset-inline-end:0; background:#fffdf7; color:var(--ink);
    border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:6px; display:none; min-width:190px; z-index:20}
  .menu.open .list{display:block}
  .menu .list button{display:block; width:100%; text-align:start; background:none; border:0; padding:9px 10px;
    border-radius:7px; font:inherit; font-size:13px; cursor:pointer; color:var(--ink)}
  .menu .list button:hover{background:#f0e7cd}
  #search{padding:7px 11px; border-radius:9px; border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.95); color:#2b2417; font:inherit; font-size:13px; width:170px; max-width:40vw}
  .hint{font-size:12px; color:#e9dcb0; opacity:.85}

  main{position:relative; z-index:1; padding:14px 12px 60px}

  /* ---------- focus view ---------- */
  .crumbs{display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; margin:2px 4px 14px; font-size:13px; color:var(--muted)}
  .crumbs a{color:var(--accent); cursor:pointer; text-decoration:none; border-bottom:1px dotted transparent}
  .crumbs a:hover{border-bottom-color:var(--accent)}
  .crumbs .sepx{opacity:.5}

  .branchpick{display:flex; flex-wrap:wrap; gap:8px; margin:0 4px 14px}
  .branchpick button{border:1px solid var(--tile-b); background:#f3ead0; color:var(--ink); padding:7px 12px;
    border-radius:999px; font:inherit; font-size:13px; cursor:pointer}
  .branchpick button.on{background:var(--gold); color:#3a2c08; font-weight:700; border-color:var(--gold-d)}

  .rowlabel{font-size:12px; color:var(--muted); text-align:center; margin:2px 0 6px; letter-spacing:.5px}
  .rowwrap{display:flex; justify-content:center}
  .strip{display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding:6px 4px; max-width:100%;
    scrollbar-width:thin; justify-content:safe center}
  .connector{height:22px; width:2px; background:var(--line); margin:0 auto}
  .cbar{height:2px; background:var(--line); margin:0 auto; border-radius:2px}

  /* person tile */
  .tile{flex:0 0 auto; width:96px; text-align:center; cursor:pointer; background:none; border:0; padding:0; font:inherit; color:inherit}
  .tile .frame{width:88px; height:88px; margin:0 auto; border-radius:8px; overflow:hidden;
    border:3px solid var(--gold); background:var(--tile); box-shadow:var(--shadow); position:relative}
  .tile .frame img{width:100%; height:100%; object-fit:cover; display:block}
  .tile .nm{margin-top:6px; font-size:13px; font-weight:600; line-height:1.3; color:var(--ink); word-break:break-word}
  .tile .sub{font-size:11px; color:var(--muted)}
  .tile.dim{opacity:.85}
  .tile .frame .badge{position:absolute; inset-block-end:0; inset-inline-start:0; background:rgba(0,0,0,.5);
    color:#fff; font-size:10px; padding:1px 4px; border-start-end-radius:6px}

  /* focus card (torn paper) */
  .focuscard{display:flex; gap:16px; align-items:center; background:var(--card); padding:16px 20px; margin:0 auto;
    max-width:min(560px,94vw); border-radius:10px; box-shadow:0 6px 20px rgba(60,45,15,.28);
    position:relative; border:1px solid #efe3c0}
  .focuscard::after{content:""; position:absolute; inset:-3px; border-radius:12px; pointer-events:none;
    background:repeating-linear-gradient(90deg,transparent 0 7px, rgba(0,0,0,.04) 7px 8px)}
  .focuscard .frame{width:110px; height:110px; flex:0 0 auto; border-radius:8px; overflow:hidden;
    border:3px solid var(--gold); background:var(--tile); box-shadow:var(--shadow)}
  .focuscard .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .focuscard .info{flex:1; min-width:0}
  .focuscard .info h2{margin:0 0 4px; font-size:22px; line-height:1.25}
  .focuscard .info .aka{color:var(--muted); font-size:14px; margin-bottom:6px}
  .focuscard .meta{font-size:13px; color:var(--muted); line-height:1.7}
  .focuscard .meta b{color:var(--ink); font-weight:600}
  .addbtn{border:1px dashed var(--gold-d); background:#f7efd6; color:var(--accent); width:88px; height:88px;
    border-radius:8px; cursor:pointer; font:inherit; font-size:12px; display:flex; align-items:center; justify-content:center; flex:0 0 auto}
  .addbtn:hover{background:#f0e4c2}
  .addwrap{width:96px; text-align:center}
  .addwrap .nm{margin-top:6px; font-size:12px; color:var(--accent)}

  .emptyparents{color:var(--muted); font-size:13px; text-align:center}

  /* edit toolbar under focus card */
  .editrow{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:12px 0 2px}
  .editrow button{border:1px solid var(--tile-b); background:#f3ead0; color:var(--ink); padding:6px 11px;
    border-radius:8px; font:inherit; font-size:12.5px; cursor:pointer}
  .editrow button.danger{color:var(--danger); border-color:#e0b3ad}
  .editrow button:hover{background:#ece0c1}

  /* ---------- editor modal ---------- */
  .modal{position:fixed; inset:0; background:rgba(40,30,10,.45); display:none; align-items:center; justify-content:center; z-index:50; padding:16px}
  .modal.open{display:flex}
  .sheet{background:var(--card); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.35); width:min(480px,96vw);
    max-height:92vh; overflow:auto; padding:18px}
  .sheet h3{margin:0 0 12px; font-size:17px}
  .field{margin-bottom:11px}
  .field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px}
  .field input,.field textarea,.field select{width:100%; padding:9px 10px; border:1px solid var(--line);
    border-radius:8px; font:inherit; font-size:14px; background:#fff; color:var(--ink)}
  .field textarea{min-height:64px; resize:vertical}
  .photoedit{display:flex; gap:12px; align-items:center; margin-bottom:12px}
  .photoedit .frame{width:84px;height:84px;border:3px solid var(--gold);border-radius:8px;overflow:hidden;background:var(--tile);flex:0 0 auto}
  .photoedit .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .sheet .actions{display:flex; gap:8px; justify-content:space-between; margin-top:8px; flex-wrap:wrap}
  .sheet .actions .right{display:flex; gap:8px; margin-inline-start:auto}

  /* ---------- outline view ---------- */
  .outline{max-width:900px; margin:0 auto}
  .outline .branchttl{font-size:19px; font-weight:700; margin:18px 4px 4px; color:var(--accent)}
  .outline .branchsub{font-size:13px; color:var(--muted); margin:0 4px 10px}
  ul.tree{list-style:none; margin:0; padding-inline-start:6px}
  ul.tree ul{list-style:none; margin:0; padding-inline-start:20px; border-inline-start:1px solid var(--line)}
  li.node{margin:3px 0}
  .orow{display:flex; align-items:center; gap:8px; padding:3px 6px; border-radius:8px}
  .orow:hover{background:rgba(255,255,255,.5)}
  .caret{cursor:pointer; width:18px; height:18px; flex:0 0 auto; border:0; background:none; color:var(--muted); font-size:12px}
  .caret.empty{visibility:hidden}
  .othumb{width:30px;height:30px;border-radius:6px;border:2px solid var(--gold);background:var(--tile);overflow:hidden;flex:0 0 auto}
  .othumb img{width:100%;height:100%;object-fit:cover;display:block}
  .oname{font-size:14.5px; font-weight:600; cursor:pointer}
  .ometa{font-size:12px; color:var(--muted)}
  li.collapsed>ul{display:none}

  .xlink{display:inline-block; background:#f6e8c8; border:1px solid var(--gold); color:var(--accent);
    border-radius:6px; font-size:11.5px; padding:1px 7px; margin-inline-start:6px}

  @media (max-width:520px){
    .focuscard .info h2{font-size:19px}
    header h1{font-size:15px}
  }

  /* ---------- splash + home (branch chooser) ---------- */
  #splash{position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; cursor:pointer;
    background:radial-gradient(120% 90% at 50% 22%, #f7efd7, #e6d4a8);}
  #splash .familybtn{display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; font:inherit;
    background:#fffdf7; border:2px solid #c8a24a; border-radius:28px; padding:clamp(26px,6vw,44px) clamp(40px,10vw,72px);
    box-shadow:0 10px 30px rgba(60,45,15,.26); transition:transform .12s, box-shadow .12s}
  #splash .familybtn:hover{transform:translateY(-3px); box-shadow:0 15px 38px rgba(60,45,15,.34)}
  #splash .familybtn:active{transform:translateY(0)}
  #splash .tree{display:block; font-size:clamp(42px,10vw,62px); filter:drop-shadow(0 3px 4px rgba(60,45,15,.25))}
  #splash .big{display:block; font-family:"SF Arabic","Geeza Pro",serif; font-size:clamp(40px,11vw,82px); font-weight:800; color:#584520; line-height:1.15}
  #splash .mashallah{display:block; font-size:clamp(26px,7vw,46px); color:#9a7a2f; margin-top:6px; font-weight:700}
  #splash .enter{margin-top:26px; font-size:15px; color:#7c6c46; border:1px solid #c8b483; border-radius:999px;
    padding:9px 20px; background:rgba(255,255,255,.55)}
  #splash.hide{opacity:0; pointer-events:none; transition:opacity .55s ease}
  .home{max-width:820px; margin:22px auto 44px; text-align:center; padding:0 12px}
  .home .htitle{font-size:clamp(30px,8vw,52px); font-weight:800; color:#584520}
  .home .hmash{font-size:clamp(20px,5vw,30px); color:#9a7a2f; margin:2px 0 6px; font-weight:700}
  .home .hsub{font-size:14px; color:var(--muted); margin-bottom:22px}
  .homegrid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px}
  .branchcard{background:var(--card); border:1px solid #e7dcbf; border-radius:18px; padding:24px 16px; cursor:pointer;
    box-shadow:var(--shadow); transition:transform .12s, box-shadow .12s}
  .branchcard:hover{transform:translateY(-3px); box-shadow:0 9px 24px rgba(60,45,15,.28)}
  .branchcard .ic{font-size:42px; line-height:1}
  .branchcard .t{font-size:18px; font-weight:700; margin-top:10px; color:var(--ink)}
  .branchcard .c{font-size:12.5px; color:var(--muted); margin-top:5px}
  @media (max-width:480px){ .branchcard{padding:18px 10px} .branchcard .t{font-size:15px} .branchcard .ic{font-size:34px} }

  /* ---------- print / PDF ---------- */
  @media print{
    header,.crumbs,.branchpick,.editrow,.hint,#splash{display:none !important}
    body{background:#fff}
    body::before{display:none}
    .outline{max-width:none}
    .orow:hover{background:none}
    ul.tree ul{border-inline-start:1px solid #999}
    li.collapsed>ul{display:block !important}
    .oname{font-size:12px}
    .othumb{width:26px;height:26px}
    a[href]:after{content:""}
  }
</style>

<div id="splash">
  <button class="familybtn" id="enter-btn">
    <span class="tree">🌳</span>
    <span class="big">عائلتنا</span>
    <span class="mashallah">ما شاء الله</span>
  </button>
  <div class="enter">اضغط لاختيار الفرع</div>
</div>

<header>
  <h1 id="home-btn" title="الصفحة الرئيسية" style="cursor:pointer">🌳 شجرة العائلة</h1>
  <button class="btn" id="home-btn2">🏠 عائلتنا</button>
  <button class="btn" id="nav-back" style="display:none">↩︎ رجوع</button>
  <input id="search" type="search" placeholder="ابحث عن اسم…" autocomplete="off">
  <button class="btn" id="mode-focus">تصفّح</button>
  <button class="btn" id="mode-outline">الشجرة الكاملة</button>
  <span class="sp"></span>
  <button class="btn" id="edit-toggle">✏️ تحرير</button>
  <div class="menu" id="export-menu">
    <button class="btn" id="export-btn">⬇︎ حفظ / تصدير</button>
    <div class="list">
      <button data-x="html">حفظ نسخة كاملة (HTML)</button>
      <button data-x="json">تصدير البيانات (JSON)</button>
      <button data-x="md">تصدير نص (Markdown)</button>
      <button data-x="print">🖨 طباعة / PDF</button>
      <hr style="border:none;border-top:1px solid #e6dcc0;margin:6px 2px">
      <button data-x="import">📂 استيراد نسخة…</button>
    </div>
  </div>
</header>

<main id="stage"></main>
<input type="file" id="photo-input" accept="image/*" style="display:none">
<input type="file" id="import-input" accept=".json,application/json,.html" style="display:none">

<div class="modal" id="editor">
  <div class="sheet">
    <h3>تعديل بيانات الشخص</h3>
    <div class="photoedit">
      <div class="frame" id="ed-frame"></div>
      <div>
        <button class="btn primary" id="ed-photo" style="color:#3a2c08">📷 إضافة / تغيير الصورة</button>
        <button class="btn" id="ed-photo-clear" style="background:#eee;color:#a33;border-color:#e0b3ad">حذف الصورة</button>
        <div class="hint" style="color:var(--muted);margin-top:6px">تُحفظ الصورة داخل الملف نفسه.</div>
      </div>
    </div>
    <div class="field"><label>الاسم</label><input id="ed-name" type="text"></div>
    <div class="field"><label>الشهرة / اللقب</label><input id="ed-aka" type="text" placeholder="مثال: (حجة)، تور الجر…"></div>
    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1"><label>النوع</label>
        <select id="ed-sex"><option value="">—</option><option value="m">ذكر</option><option value="f">أنثى</option></select></div>
      <div style="flex:1"><label>الميلاد</label><input id="ed-born" type="text" placeholder="سنة/تاريخ"></div>
      <div style="flex:1"><label>الوفاة</label><input id="ed-died" type="text" placeholder="سنة/تاريخ"></div>
    </div>
    <div class="field"><label>الزواج (الزوج/الزوجة)</label><input id="ed-marriage" type="text"></div>
    <div class="field"><label>ملاحظات</label><textarea id="ed-notes"></textarea></div>
    <div class="actions">
      <button class="btn" id="ed-delete" style="background:#f7e7e4;color:#a33;border-color:#e0b3ad">🗑 حذف الشخص</button>
      <div class="right">
        <button class="btn" id="ed-cancel" style="background:#eee;color:#333">إلغاء</button>
        <button class="btn primary" id="ed-save" style="color:#3a2c08">حفظ</button>
      </div>
    </div>
  </div>
</div>

function avatarFor(p){ return p.sex==="f" ? (AV_IMG.f||SVG_F) : (AV_IMG.m||SVG_M); }
function photoSrc(p){ return p.photo ? p.photo : avatarFor(p); }

/* metaline for cards */
function metaLine(p){
  const bits=[];
  if(p.born) bits.push("و. "+p.born);
  if(p.died) bits.push("ت. "+p.died);
  if(p.marriage) bits.push("⚭ "+p.marriage);
  return bits.join("  ·  ");
}

/* =========================================================
   TILE (photo + name), clickable to focus
   ========================================================= */
function tileEl(p, {onClick, dim, badge}={}){
  const b = el("button","tile"+(dim?" dim":""));
  const fr = el("div","frame");
  const img = el("img"); img.src = photoSrc(p); img.alt = p.name||""; img.loading="lazy";
  fr.appendChild(img);
  if(badge){ const bd=el("span","badge",badge); fr.appendChild(bd); }
  b.appendChild(fr);
  const nm = el("div","nm", p.name||"—"); b.appendChild(nm);
  if(p.aka){ b.appendChild(el("div","sub",p.aka)); }
  const dsub = metaLine(p);
  if(dsub){ const d=el("div","sub",dsub); b.appendChild(d); }
  b.addEventListener("click", onClick || (()=>focusOn(p.id)) );
  return b;
}

function addTile(label, onClick){
  const w = el("div","addwrap");
  const b = el("button","addbtn"); b.innerHTML = "➕"; b.title=label;
  b.addEventListener("click", onClick);
  w.appendChild(b); w.appendChild(el("div","nm",label));
  return w;
}

/* =========================================================
   FOCUS VIEW
   ========================================================= */
let navHistory = [];
function focusOn(id, _back){
  const info = IDX[id]; if(!info) return;
  if(!_back && state.focusId && state.focusId!==id) navHistory.push(state.focusId);
  state.focusId = id; state.branchId = info.branch.id; state.mode="focus";
  render();
}
function goBack(){
  if(!navHistory.length) return;
  const id = navHistory.pop();
  if(IDX[id]) focusOn(id, true);
}

function crumbsFor(id){
  const path=[]; let cur=id;
  while(cur){ const info=IDX[cur]; if(!info) break; path.unshift(info.person); cur = info.parent ? info.parent.id : null; }
  return path;
}

function renderFocus(stage){
  const p = personById(state.focusId);
  if(!p){ stage.appendChild(el("p",null,"لا يوجد شخص محدد.")); return; }
  const parent = parentOf(p.id);
  const br = branchOf(p.id);

  // breadcrumbs
  const cr = el("div","crumbs");
  cr.appendChild(el("span","",br.title+" ›"));
  crumbsFor(p.id).forEach((pp,i,arr)=>{
    const a=el("a",null,pp.name); a.addEventListener("click",()=>focusOn(pp.id)); cr.appendChild(a);
    if(i<arr.length-1) cr.appendChild(el("span","sepx"," ‹ "));
  });
  stage.appendChild(cr);

  // ---- parents row ----
  const plabel = el("div","rowlabel", parent ? "الأب / الأم" : "الأصل");
  stage.appendChild(plabel);
  const prow = el("div","rowwrap"); const pstrip=el("div","strip");
  if(parent){
    pstrip.appendChild(tileEl(parent,{onClick:()=>focusOn(parent.id)}));
    if(parent.marriage){
      const mother = {name:parent.marriage, sex:(parent.sex==="m"?"f":"m"), _virtual:true};
      const mt = tileEl(mother,{onClick:()=>{}}); mt.classList.add("dim"); pstrip.appendChild(mt);
    }
  } else {
    const org = el("div","emptyparents", (br.origin? br.origin : "أصل الفرع") );
    pstrip.appendChild(org);
    if(state.edit){ pstrip.appendChild(addTile("إضافة أب", ()=>addParent(p.id))); }
  }
  prow.appendChild(pstrip); stage.appendChild(prow);
  stage.appendChild(el("div","connector"));

  // ---- focus card ----
  const fc = el("div","focuscard");
  const fr = el("div","frame"); const im=el("img"); im.src=photoSrc(p); fr.appendChild(im);
  if(state.edit){ fr.style.cursor="pointer"; fr.title="تغيير الصورة"; fr.addEventListener("click",()=>pickPhoto(p.id)); }
  fc.appendChild(fr);
  const info=el("div","info");
  const h2=el("h2",null,p.name||"—"); info.appendChild(h2);
  if(p.aka) info.appendChild(el("div","aka",p.aka));
  const meta=el("div","meta");
  const rows=[];
  if(p.born) rows.push("<b>الميلاد:</b> "+esc(p.born));
  if(p.died) rows.push("<b>الوفاة:</b> "+esc(p.died));
  if(p.marriage) rows.push("<b>الزواج:</b> "+esc(p.marriage));
  if(p.notes) rows.push("<b>ملاحظات:</b> "+esc(p.notes));
  if(p.xlink) rows.push('<span class="xlink">🔗 '+esc(p.xlink)+'</span>');
  meta.innerHTML = rows.length? rows.join("<br>") : '<span style="opacity:.6">— لا معلومات بعد —</span>';
  info.appendChild(meta);
  fc.appendChild(info);
  stage.appendChild(fc);

  // edit row — only visible in Edit mode (keeps browsing clean)
  if(state.edit){
    const er = el("div","editrow");
    const bEdit = el("button",null,"✏️ تعديل البيانات"); bEdit.addEventListener("click",()=>openEditor(p.id)); er.appendChild(bEdit);
    const bPhoto = el("button",null,"📷 صورة"); bPhoto.addEventListener("click",()=>pickPhoto(p.id)); er.appendChild(bPhoto);
    const bChild = el("button",null,"➕ إضافة ابن/ابنة"); bChild.addEventListener("click",()=>addChild(p.id)); er.appendChild(bChild);
    stage.appendChild(er);
  } else {
    // a single gentle hint to tap a person
    stage.appendChild(el("div","rowlabel", VIEW_ONLY
      ? "اضغط على أي شخص للتنقّل • هذه نسخة للاطلاع — لإضافة صورة أو معلومة أرسلها لصاحب الشجرة"
      : "اضغط على أي شخص للتنقّل • زر «تحرير» لإضافة صورة أو معلومة"));
  }

  // ---- children ----
  const kids = p.children||[];
  stage.appendChild(el("div","connector"));
  stage.appendChild(el("div","rowlabel",
    kids.length ? ("الأبناء ("+kids.length+")") : (state.edit ? "الأبناء" : "— لا أبناء مسجّلون في المصدر —")));
  if(kids.length){ const bar=el("div","cbar"); bar.style.width="70%"; stage.appendChild(bar); }
  const crow=el("div","rowwrap"); const cstrip=el("div","strip");
  kids.forEach(k=>{
    const badge = (k.children&&k.children.length)? ("👥 "+countDesc(k)) : null;
    cstrip.appendChild(tileEl(k,{onClick:()=>focusOn(k.id), badge}));
  });
  if(state.edit) cstrip.appendChild(addTile("إضافة ابن/ابنة", ()=>addChild(p.id)));
  crow.appendChild(cstrip); stage.appendChild(crow);
}

function countDesc(p){ let n=0; (p.children||[]).forEach(c=>{n+=1+countDesc(c);}); return n; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

/* =========================================================
   OUTLINE VIEW (all generations; used for print/PDF too)
   ========================================================= */
function renderOutline(stage){
  const wrap=el("div","outline");
  (DATA.branches||[]).forEach(b=>{
    wrap.appendChild(el("div","branchttl", b.title));
    if(b.subtitle||b.origin) wrap.appendChild(el("div","branchsub",[b.subtitle,b.origin].filter(Boolean).join(" — ")));
    const ul=el("ul","tree");
    (b.roots||[]).forEach(r=> ul.appendChild(outlineNode(r)) );
    wrap.appendChild(ul);
  });
  stage.appendChild(wrap);
}
function outlineNode(p){
  const li=el("li","node");
  if(state.collapsed[p.id]) li.classList.add("collapsed");
  const row=el("div","orow");
  const hasKids=(p.children||[]).length>0;
  const car=el("button","caret"+(hasKids?"":" empty"), state.collapsed[p.id]?"▶":"▼");
  if(hasKids) car.addEventListener("click",()=>{ state.collapsed[p.id]=!state.collapsed[p.id]; render(); });
  row.appendChild(car);
  const th=el("div","othumb"); const im=el("img"); im.src=photoSrc(p); im.loading="lazy"; th.appendChild(im); row.appendChild(th);
  const nm=el("span","oname",p.name+(p.aka?(" "+p.aka):"")); nm.addEventListener("click",()=>focusOn(p.id)); row.appendChild(nm);
  const m=metaLine(p); if(m) row.appendChild(el("span","ometa"," — "+m));
  if(p.xlink){ const x=el("span","xlink","🔗 "+p.xlink); row.appendChild(x); }
  li.appendChild(row);
  if(hasKids){
    const ul=el("ul"); (p.children||[]).forEach(c=> ul.appendChild(outlineNode(c)) ); li.appendChild(ul);
  }
  return li;
}

/* =========================================================
   EDITING
   ========================================================= */
let photoTargetId=null;
function pickPhoto(id){ photoTargetId=id; $("#photo-input").click(); }
$("#photo-input").addEventListener("change",function(){
  const f=this.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ const p=personById(photoTargetId); if(p){ p.photo=rd.result; save(); render(); if($("#editor").classList.contains("open")) refreshEditorPhoto(p);} };
  rd.readAsDataURL(f); this.value="";
});

function addChild(id){
  const p=personById(id); if(!p) return;
  const name=prompt("اسم الابن/الابنة الجديد:"); if(!name) return;
  const kid={name:name.trim(), children:[]};
  (p.children=p.children||[]).push(kid);
  reindex(); save(); focusOn(kid.id);
}
function addParent(id){
  const p=personById(id); if(!p) return;
  const br=branchOf(id);
  const name=prompt("اسم الأب/الأصل الجديد (سيصبح جذرًا للفرع):"); if(!name) return;
  const np={name:name.trim(), children:[p]};
  const i=br.roots.findIndex(r=>r.id===id);
  if(i>=0) br.roots[i]=np; else br.roots.push(np);
  reindex(); save(); focusOn(np.id);
}
function deletePerson(id){
  const info=IDX[id]; if(!info) return;
  if(!confirm("حذف هذا الشخص وكل من تحته في الشجرة؟")) return;
  const par=info.parent;
  if(par){ par.children=(par.children||[]).filter(c=>c.id!==id); reindex(); save(); focusOn(par.id); }
  else{ const br=info.branch; br.roots=br.roots.filter(r=>r.id!==id); reindex(); save();
    state.focusId=(br.roots[0]||{}).id||null; render(); }
}

/* editor modal */
let editingId=null;
function openEditor(id){
  const p=personById(id); if(!p) return; editingId=id;
  $("#ed-name").value=p.name||""; $("#ed-aka").value=p.aka||"";
  $("#ed-sex").value=p.sex||""; $("#ed-born").value=p.born||""; $("#ed-died").value=p.died||"";
  $("#ed-marriage").value=p.marriage||""; $("#ed-notes").value=p.notes||"";
  refreshEditorPhoto(p);
  $("#editor").classList.add("open");
}
function refreshEditorPhoto(p){ const fr=$("#ed-frame"); fr.innerHTML=""; const im=el("img"); im.src=photoSrc(p); fr.appendChild(im); }
$("#ed-photo").addEventListener("click",()=>{ if(editingId) pickPhoto(editingId); });
$("#ed-photo-clear").addEventListener("click",()=>{ const p=personById(editingId); if(p){p.photo="";save();refreshEditorPhoto(p);render();} });
$("#ed-cancel").addEventListener("click",()=>$("#editor").classList.remove("open"));
$("#ed-delete").addEventListener("click",()=>{ $("#editor").classList.remove("open"); if(editingId) deletePerson(editingId); });
$("#ed-save").addEventListener("click",()=>{
  const p=personById(editingId); if(!p) return;
  p.name=$("#ed-name").value.trim()||p.name; p.aka=$("#ed-aka").value.trim();
  p.sex=$("#ed-sex").value; p.born=$("#ed-born").value.trim(); p.died=$("#ed-died").value.trim();
  p.marriage=$("#ed-marriage").value.trim(); p.notes=$("#ed-notes").value.trim();
  save(); $("#editor").classList.remove("open"); render();
});

/* =========================================================
   EXPORT / IMPORT / PRINT
   ========================================================= */
function download(name, text, type){
  const blob=new Blob([text],{type:type||"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function stripIds(obj){ // clean copy without runtime ids
  return JSON.parse(JSON.stringify(obj, (k,v)=> k==="id"?undefined:v));
}
function exportJSON(){ download("family-tree-data.json", JSON.stringify(stripIds(DATA),null,2), "application/json"); }
function exportHTML(){
  const doc="<!doctype html>\n<html>\n"+document.documentElement.innerHTML+"\n</html>";
  // replace the embedded data with current DATA
  const clean = JSON.stringify(stripIds(DATA),null,2);
  const out = doc.replace(/<script id="tree-data"[^>]*>[\s\S]*?<\/script>/,
     '<script id="tree-data" type="application/json">\n'+clean+'\n</'+'script>');
  download("شجرة-العائلة.html", out, "text/html;charset=utf-8");
}
function exportMarkdown(){
  let out="# "+(DATA.title||"شجرة العائلة")+"\n\n";
  const line=(p,d)=>{
    let s="  ".repeat(d)+"- **"+p.name+"**"+(p.aka?(" "+p.aka):"");
    const m=[]; if(p.born)m.push("و. "+p.born); if(p.died)m.push("ت. "+p.died);
    if(p.marriage)m.push("⚭ "+p.marriage); if(p.notes)m.push(p.notes); if(p.xlink)m.push("🔗 "+p.xlink);
    if(m.length) s+=" — "+m.join(" · ");
    if(p.photo) s+="  ![صورة]("+ (p.photo.slice(0,24)==="data:image"?"(صورة مضمّنة)":p.photo) +")";
    out+=s+"\n";
    (p.children||[]).forEach(c=>line(c,d+1));
  };
  (DATA.branches||[]).forEach(b=>{ out+="\n## "+b.title+"\n"; if(b.origin)out+="> "+b.origin+"\n"; out+="\n";
    (b.roots||[]).forEach(r=>line(r,0)); });
  download("شجرة-العائلة.md", out, "text/markdown;charset=utf-8");
}
function doImport(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      let txt=rd.result, obj;
      if(/\.html?$/i.test(file.name)||/^\s*<!doctype/i.test(txt)){
        const m=txt.match(/<script id="tree-data"[^>]*>([\s\S]*?)<\/script>/);
        obj=JSON.parse(m[1]);
      } else obj=JSON.parse(txt);
      if(!obj.branches) throw new Error("no branches");
      DATA=obj; reindex(); save();
      state.branchId=(DATA.branches[0]||{}).id; state.focusId=((DATA.branches[0]||{}).roots||[])[0]?.id||null;
      render(); alert("تم استيراد البيانات.");
    }catch(e){ alert("تعذّر قراءة الملف: "+e.message); }
  };
  rd.readAsText(file);
}
$("#import-input").addEventListener("change",function(){ if(this.files[0]) doImport(this.files[0]); this.value=""; });

/* export menu */
const emenu=$("#export-menu");
$("#export-btn").addEventListener("click",e=>{ e.stopPropagation(); emenu.classList.toggle("open"); });
document.addEventListener("click",()=>emenu.classList.remove("open"));
emenu.querySelector(".list").addEventListener("click",e=>{
  const x=e.target.getAttribute("data-x"); if(!x) return;
  emenu.classList.remove("open");
  if(x==="json")exportJSON(); else if(x==="html")exportHTML(); else if(x==="md")exportMarkdown();
  else if(x==="print"){ state.mode="outline"; render(); setTimeout(()=>window.print(),200); }
  else if(x==="import")$("#import-input").click();
});

/* =========================================================
   TOP CONTROLS + RENDER
   ========================================================= */
$("#nav-back").addEventListener("click", goBack);
$("#mode-focus").addEventListener("click",()=>{ state.mode="focus"; render(); });
$("#mode-outline").addEventListener("click",()=>{ state.mode="outline"; render(); });
$("#edit-toggle").addEventListener("click",function(){ state.edit=!state.edit; render(); });

let searchTimer=null;
$("#search").addEventListener("input",function(){
  const q=this.value.trim();
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>runSearch(q),160);
});
function runSearch(q){
  if(!q){ render(); return; }
  const hits=[];
  Object.values(IDX).forEach(o=>{ if((o.person.name||"").includes(q)||(o.person.aka||"").includes(q)) hits.push(o.person); });
  const stage=$("#stage"); stage.innerHTML="";
  stage.appendChild(el("div","rowlabel","نتائج البحث: "+hits.length));
  const strip=el("div","strip"); strip.style.flexWrap="wrap"; strip.style.justifyContent="center";
  hits.slice(0,120).forEach(p=> strip.appendChild(tileEl(p,{onClick:()=>{ $("#search").value=""; focusOn(p.id);} })) );
  const w=el("div","rowwrap"); w.appendChild(strip); stage.appendChild(w);
}

function renderBranchPicker(stage){
  if((DATA.branches||[]).length<2) return;
  const bp=el("div","branchpick");
  DATA.branches.forEach(b=>{
    const btn=el("button",null,b.title);
    if(b.id===state.branchId) btn.classList.add("on");
    btn.addEventListener("click",()=>{ const r=(b.roots||[])[0]; if(r){ focusOn(r.id); } else { state.branchId=b.id; state.mode="focus"; render(); } });
    bp.appendChild(btn);
  });
  stage.appendChild(bp);
}

function renderHome(stage){
  const h=el("div","home");
  h.appendChild(el("div","htitle","اختر الفرع"));
  h.appendChild(el("div","hsub","اضغط على الفرع لعرض شجرته"));
  const grid=el("div","homegrid");
  (DATA.branches||[]).forEach(b=>{
    const card=el("div","branchcard");
    card.appendChild(el("div","ic","🌳"));
    card.appendChild(el("div","t",b.title));
    const total=(b.roots||[]).reduce((s,r)=> s+1+countDesc(r), 0);
    card.appendChild(el("div","c", total+" شخص"));
    card.addEventListener("click",()=>{ const r=(b.roots||[])[0]; if(r) focusOn(r.id); });
    grid.appendChild(card);
  });
  h.appendChild(grid);
  stage.appendChild(h);
}

function render(){
  // sync focus branch if needed
  if(state.focusId && IDX[state.focusId]) state.branchId=IDX[state.focusId].branch.id;
  $("#edit-toggle").classList.toggle("on",state.edit);
  $("#mode-focus").classList.toggle("on",state.mode==="focus");
  $("#mode-outline").classList.toggle("on",state.mode==="outline");
  const _bk=$("#nav-back"); if(_bk) _bk.style.display=(navHistory.length && state.mode==="focus")?"":"none";
  const stage=$("#stage"); stage.innerHTML="";
  if(state.mode==="home"){ renderHome(stage); }
  else if(state.mode==="focus"){ renderBranchPicker(stage); renderFocus(stage); }
  else renderOutline(stage);
}
function showSplash(){ var sp=$("#splash"); if(sp){ sp.style.display="flex"; sp.classList.remove("hide"); } window.scrollTo(0,0); }
function enterHome(){ state.mode="home"; render(); var sp=$("#splash"); if(sp){ sp.classList.add("hide"); setTimeout(()=>{ sp.style.display="none"; },450); } }
$("#home-btn").addEventListener("click", showSplash);
$("#home-btn2").addEventListener("click", showSplash);
(function(){ var eb=$("#enter-btn"); if(eb) eb.addEventListener("click", enterHome);
  var sp=$("#splash"); if(sp) sp.addEventListener("click", function(e){ if(e.target===sp) enterHome(); }); })();
if(VIEW_ONLY){ state.edit=false; var _et=$("#edit-toggle"); if(_et) _et.style.display="none"; }
render();
</script>
